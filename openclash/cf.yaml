#机场设置锚点
base-provider: &base-provider { type: http, interval: 3600, proxy: DIRECT, header: { User-Agent: ['clash.meta/v1.19.29', 'clash-verge/v2.5.2', 'mihomo'] }, override: { additional-prefix: '[机场名]' }, health-check: { enable: true, interval: 3600, lazy: true, url: https://www.gstatic.com/generate_204 } }
#过滤器锚点
base-filter-hk: &base-filter-hk { filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-hk.png }
base-filter-tw: &base-filter-tw { filter: '(?i)(台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-cn.png }
base-filter-sg: &base-filter-sg { filter: '(?i)(坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-sg.png }
base-filter-jp: &base-filter-jp { filter: '(?i)(日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-jp.png }
base-filter-kr: &base-filter-kr { filter: '(?i)(韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|Korea|KOR)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-kr.png }
base-filter-my: &base-filter-my { filter: '(?i)(马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-my.png }
base-filter-us: &base-filter-us { filter: '(?i)(美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-um.png }
base-filter-ca: &base-filter-ca { filter: '(?i)(加|加拿大|🇨🇦|(?<![A-Za-z])CA(?![A-Za-z])|Canada|CAN)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-ca.png }
base-filter-gb: &base-filter-gb { filter: '(?i)(英|🇬🇧|(?<![A-Za-z])(UK|GB)(?![A-Za-z])|Britain|United Kingdom|GBR)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-gb.png }
base-filter-de: &base-filter-de { filter: '(?i)(德国|🇩🇪|法兰克福|(?<![A-Za-z])DE(?![A-Za-z])|Germany|GER)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-de.png }
base-filter-au: &base-filter-au { filter: '(?i)(澳大利亚|澳洲|🇦🇺|悉尼|墨尔本|(?<![A-Za-z])AU(?![A-Za-z])|Australia|AUS)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-au.png }
base-filter-yxym: &base-filter-yxym { filter: '(?i)(优选)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/group-yxym.png }
base-filter-other: &base-filter-other { exclude-filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG|台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE|坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP|日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN|韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|Korea|KOR|马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS|美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA|加|加拿大|🇨🇦|(?<![A-Za-z])CA(?![A-Za-z])|Canada|CAN|英|🇬🇧|(?<![A-Za-z])(UK|GB)(?![A-Za-z])|Britain|United Kingdom|GBR|德国|🇩🇪|法兰克福|(?<![A-Za-z])DE(?![A-Za-z])|Germany|GER|澳大利亚|澳洲|🇦🇺|悉尼|墨尔本|(?<![A-Za-z])AU(?![A-Za-z])|Australia|AUS|优选)', icon: https://raw.githubusercontent.com/baobeibaobei/rule/main/openclash/icon/region-other.png }
#DNS代理锚点
base-dns: &base-dns { type: select, proxies: [自动选择, 负载均衡, CF优选, 美国, 新加坡, 香港, 日本, 韩国, 马来西亚, 加拿大, 英国, 德国, 澳大利亚, 台湾省, 其他节点] }
#默认策略锚点
urltest-first: &urltest-first { type: select, proxies: [自动选择, DIRECT, 手动选择, 负载均衡, CF优选, 美国, 新加坡, 香港, 日本, 韩国, 马来西亚, 加拿大, 英国, 德国, 澳大利亚, 台湾省, 其他节点] }
direct-first: &direct-first { type: select, proxies: [DIRECT, 自动选择, 手动选择, 负载均衡, CF优选, 美国, 新加坡, 香港, 日本, 韩国, 马来西亚, 加拿大, 英国, 德国, 澳大利亚, 台湾省, 其他节点] }
reject-first: &reject-first { type: select, proxies: [REJECT, 自动选择, 手动选择, DIRECT] }
#基础策略锚点
base-urltest: &base-urltest { type: url-test, interval: 1800, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, tolerance: 200, hidden: true, url: https://www.gstatic.com/generate_204 }
base-loadbalance: &base-loadbalance { type: load-balance, interval: 1800, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, strategy: sticky-sessions, hidden: true, url: https://www.gstatic.com/generate_204 }
#规则集锚点
base-ruleset-dn-mrs: &base-ruleset-dn-mrs { type: http, behavior: domain, format: mrs, interval: 86400 }
base-ruleset-ip-mrs: &base-ruleset-ip-mrs { type: http, behavior: ipcidr, format: mrs, interval: 86400 }
base-ruleset-dn-text: &base-ruleset-dn-text { type: http, behavior: classical, format: text,interval: 86400 }
base-ruleset-dn-yaml: &base-ruleset-dn-yaml { type: http, behavior: classical, format: yaml,interval: 86400 }

proxy-providers:
  provider1:
    <<: *base-provider
    url: '订阅链接'
    age-secret-key: ''

mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
log-level: info
external-controller: 0.0.0.0:9090
bind-address: '*'
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
keep-alive-interval: 60
keep-alive-idle: 60

experimental:
  quic-go-disable-gso: true

tun:
  enable: false
  auto-detect-interface: true
  auto-route: true
  strict-route: true
  auto-redirect: true
  device: mihomo
  disable-icmp-forwarding: true
  dns-hijack:
    - 0.0.0.0:53
  stack: mixed

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  use-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip-filter', 'rule-set:geolocation-cn']
  default-nameserver: ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  proxy-server-nameserver: ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  nameserver: ['https://dns.google/dns-query#DNS', 'https://doh.opendns.com/dns-query#DNS', 'https://cloudflare-dns.com/dns-query#DNS']
  nameserver-policy:
    'rule-set:cn': ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  direct-nameserver: ['223.6.6.6#DIRECT', '119.29.29.29#DIRECT']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'doh.opendns.com': ['208.67.222.222', '208.67.220.220']
  'services.googleapis.cn': 'services.googleapis.com'

profile: { store-selected: true, store-fake-ip: true }

ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60

